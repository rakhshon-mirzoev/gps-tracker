version: "3.9"

services:
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - minio_data:/data

  core:
    image: ghcr.io/rakhshon-mirzoev/gps-tracker
    container_name: core
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config.json:/cmd/config.json
    networks:
      - app_network

volumes:
  minio_data:

networks:
  app_network:
    driver: bridge