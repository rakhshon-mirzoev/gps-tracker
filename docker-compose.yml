version: "3.9"

services:
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - minio_data:/data

  admin:
    image: ghcr.io/rakhshon-mirzoev/gps-tracker:latest
    container_name: admin
    command: ["/app/admin"]
    ports:
      - "8081:8080"
    volumes:
      - ./config.json:/app/config.json

  mobile:
    image: ghcr.io/rakhshon-mirzoev/gps-tracker:latest
    container_name: mobile
    command: ["/app/mobile"]
    ports:
      - "8080:8080"
    volumes:
      - ./config.json:/app/config.json"

volumes:
  minio_data:

networks:
  app_network:
    driver: bridge