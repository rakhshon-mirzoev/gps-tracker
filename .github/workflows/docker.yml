name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            admin:
              - 'cmd/admin/**'
            mobile:
              - 'cmd/mobile/**'

      - name: Build and push image Admin
        if: steps.changes.outputs.admin == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.admin
          push: true
          tags: ghcr.io/rakhshon-mirzoev/gps-tracker-admin:latest

      - name: Build and push image Mobile
        if: steps.changes.outputs.mobile == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.mobile
          push: true
          tags: ghcr.io/rakhshon-mirzoev/gps-tracker-mobile:latest

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/projects/gps-tracker
            docker pull ghcr.io/rakhshon-mirzoev/gps-tracker-admin:latest
            docker pull ghcr.io/rakhshon-mirzoev/gps-tracker-mobile:latest
            docker compose up -d admin
            docker compose up -d mobile
